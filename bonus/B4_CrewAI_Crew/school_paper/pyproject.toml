[project]
name = "school_paper"
version = "0.1.0"
description = "school_paper using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.15.40"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["agents", "crew.jsonc", "tools"]

[tool.crewai]
type = "crew"
definition = "crew.jsonc"
project_id = "8eb93f92-7582-4ead-a640-b27a7732f8c4"
