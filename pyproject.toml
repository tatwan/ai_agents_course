    "litellm==1.108.4",
    "matplotlib==3.11.2",
    "mcp==2.3.0",
    "mlflow==3.17.2",
    "openai==3.42.0",
    "openai-agents[viz]==0.24.0",
    "pinecone==10.2.0",
    "pydantic-ai-slim[openai]==2.64.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
