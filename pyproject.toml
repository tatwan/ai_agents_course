# LlamaIndex (Lab 14) joined the core on 12 Nov 2026: llama-index-llms-openai 0.8.4 accepts openai 3.
# Labs 08, B4 and B5 keep their own pyproject.toml in their folder.
dependencies = [
    "chromadb==1.5.9",
    "gradio==6.31.0",
    "ipykernel==7.4.0",
    "jupyterlab==4.6.6",
    "langchain==1.4.10",
    "langchain-core==1.7.7",
    "langchain-openai==1.7.4",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.3",
    "langsmith==0.14.17",
    "llama-index-core==0.14.25",
    "llama-index-embeddings-openai==0.7.0",
    "llama-index-llms-openai==0.8.4",
    "litellm[proxy]==1.109.0",
    "matplotlib==3.11.2",
    "mcp==2.3.0",
    "mlflow==3.18.0",
    "openai==3.49.0",
    "openai-agents[viz]==0.24.0",
    "pinecone==10.3.0",
    "pydantic-ai-slim[cli,openai,web]==2.68.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]
