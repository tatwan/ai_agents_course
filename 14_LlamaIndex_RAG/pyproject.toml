[project]
name = "ai-agents-lab14-llamaindex"
version = "0.1.0"
description = "Lab 14's own environment: LlamaIndex needs openai<3, the core environment has openai 3"
requires-python = ">=3.11,<3.15"
dependencies = [
    "ipykernel==7.4.0",
    "llama-index-core==0.14.25",
    "llama-index-embeddings-openai==0.7.0",
    "llama-index-llms-openai==0.8.3",
    # llama-index-llms-openai 0.8.3 requires openai<3: 2.54.0 is the latest 2.x release
    "openai==2.54.0",
    "python-dotenv==1.2.4",
]

[tool.uv]
package = false
