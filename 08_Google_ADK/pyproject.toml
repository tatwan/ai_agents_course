[project]
name = "ai-agents-lab08-adk"
version = "0.2.0"
description = "Isolated environment for 08_Google_ADK"
requires-python = ">=3.11,<3.15"
# Latest stable releases, checked on PyPI on 10 Nov 2026.
# openai stays on 2.54.0: google-adk 2.14.0's openai extra requires openai>=2.20,<3.
dependencies = [
    "google-adk[openai]==2.14.0",
    "openai==2.54.0",
    "ipykernel==7.4.0",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
]

[tool.uv]
package = false
